# Backstop de concorrencia na entrada interna. Nao e um limite de conexoes TCP:
# o Traefik so oferece cap de conexao para roteadores TCP puros (inFlightConn),
# e estes aqui sao roteadores HTTP. O que se limita e request simultanea em voo,
# que protege contra a mesma coisa (exaustao sob pico) sem contar socket aberto.
#
# Dimensionamento: o pico medido nesta VPS foi ~195 requests em voo
# (2308 rps x 84ms de latencia) antes da maquina saturar. 1000 e teto de
# seguranca deliberado -- nao deve disparar em operacao normal.
#
# Sem sourceCriterion de proposito. A versao anterior (fb1d619) usava
# `requestHost: true`, o que dava um orcamento de 1000 para cada hostname em vez
# de um limite agregado. O default e por IP de origem, e como todo o trafego
# externo chega do pod do cloudflared, o efeito pratico e um contador unico.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: global-inflight
  namespace: kube-system
spec:
  inFlightReq:
    amount: 1000
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
    # Profile de CPU do Traefik sob carga (pprof, 30s a ~6300 rps) apontou
    # middlewares/metrics.(*metricsMiddleware).ServeHTTP com 29,6% do tempo
    # total, encadeando ainda observability.(*semConvServerMetrics) -- uma
    # segunda camada de metricas semanticas OTel.
    #
    # Nada consome isso: nao ha Prometheus no cluster e o otel-collector em
    # apps/observability/collector.yaml so tem receivers otlp, filelog,
    # kubeletstats e hostmetrics. As anotacoes prometheus.io/scrape do pod nao
    # tem scraper.
    #
    # Medido depois de desligar, mesmo teste (wrk -c50 contra o entrypoint web):
    #   antes  6543 rps  172us/req
    #   depois 7195 rps  141us/req
    #
    # Para religar em investigacao, basta remover este bloco. O restante do gap
    # para um nginx equivalente (~30us/req) e estrutural -- runtime do Go e uma
    # cadeia de ~15 middlewares por request -- e nao sai por configuracao.
    metrics:
      prometheus: null
    # O caminho e ports.<entrypoint>.http.middlewares. A variante sem o `http`
    # e aceita sem erro pelo HelmChartConfig e descartada na renderizacao: o
    # Deployment sai sem nenhum arg de middleware e sem rollout. Era esse o
    # defeito do fb1d619, ou seja, aquele limitador nunca esteve ativo.
    # Conferir com:
    #   kubectl get deploy -n kube-system traefik \
    #     -o jsonpath='{.spec.template.spec.containers[0].args}' | tr ',' '\n' | grep middlewares
    ports:
      web:
        http:
          middlewares:
            - kube-system-global-inflight@kubernetescrd
      websecure:
        http:
          middlewares:
            - kube-system-global-inflight@kubernetescrd
