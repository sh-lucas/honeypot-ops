apiVersion: v1
kind: Namespace
metadata:
  name: checkup
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkup
  namespace: checkup
  labels:
    app: checkup
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: checkup
  template:
    metadata:
      labels:
        app: checkup
    spec:
      containers:
        - name: checkup
          image: registry.sh-lucas.dev/checkup:2026.08.28--037--4889428 # {"$imagepolicy": "flux-system:checkup"}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /api
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: PORT
              value: "80"
            - name: DATABASE_URL
              value: "sqlite:///data/database.db"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: checkup-secrets
                  key: JWT_SECRET
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
            - name: DEPLOYMENT_ENVIRONMENT
              value: production
          resources:
            limits:
              cpu: 50m
              memory: 128Mi
            requests:
              cpu: 5m
              memory: 32Mi
          volumeMounts:
            - name: db
              mountPath: /data
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: checkup-db
