apiVersion: image.toolkit.fluxcd.io/v1beta1
kind: ImageUpdateAutomation
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        email: fluxcdbot@sh-lucas.dev
        name: fluxcdbot
      messageTemplate: 'chore(infra): [ci skip] auto-update checkup image tag'
  update:
    path: ./kubernetes/apps/checkup
    strategy: Setters
