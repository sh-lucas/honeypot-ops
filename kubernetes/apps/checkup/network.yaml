apiVersion: v1
kind: Service
metadata:
  name: checkup
  namespace: checkup
spec:
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: checkup
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkup
  namespace: checkup
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: checkup.sh-lucas.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: checkup
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-only
  namespace: checkup
spec:
  podSelector:
    matchLabels:
      app: checkup
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 80
