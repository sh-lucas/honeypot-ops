apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      - nodes
      - nodes/stats
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: observability
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: ${env:POD_IP}:13133
      basicauth/openobserve:
        client_auth:
          username: ${env:OPENOBSERVE_USERNAME}
          password: ${env:OPENOBSERVE_PASSWORD}

    receivers:
      otlp:
        protocols:
          http:
            endpoint: ${env:POD_IP}:4318
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/observability_*/*/*.log
        include_file_path: true
        start_at: end
        operators:
          - type: container
      kubeletstats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: ${env:K8S_NODE_NAME}:10250
        insecure_skip_verify: true
        metric_groups:
          - node
          - pod
          - container
      hostmetrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu: {}
          memory: {}
          filesystem: {}
          network: {}

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 160
        spike_limit_mib: 48
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
            - k8s.container.name
      # Descarta logs de ruído: probes de liveness/readiness, health checks e
      # requests 2xx em endpoints de health. Isso reduz drasticamente o volume
      # de dados enviados ao OpenObserve sem perder nada útil.
      filter/drop_noise:
        error_mode: ignore
        logs:
          log_record:
            # Descarta linhas que contenham URLs de health/readiness check
            - 'IsMatch(body, ".*GET /(healthz?|readyz?|api|livez?) .*")'
            # Descarta 200 OK de qualquer rota de health (nginx, traefik, etc)
            - 'IsMatch(body, ".*\"(GET|HEAD) /(healthz?|readyz?|livez?).*\" 200.*")'
            # Descarta logs completamente vazios
            - 'body == ""'
      # Promove level/message/traceId do JSON de stdout das apps para
      # atributos indexáveis. Logs de infra que não são JSON são ignorados
      # (error_mode: ignore) e seguem com o body cru mesmo.
      transform/parse_json:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - 'merge_maps(cache, ParseJSON(body), "upsert") where IsMatch(body, "^\\s*\\{")'
              - 'set(attributes["level"], cache["level"]) where cache["level"] != nil'
              - 'set(attributes["message"], cache["message"]) where cache["message"] != nil'
              - 'set(attributes["traceId"], cache["traceId"]) where cache["traceId"] != nil'
      batch:
        timeout: 5s
        send_batch_size: 1024

    connectors:
      # Separa logs de infra (kube-system, cert-manager, traefik, flux-system,
      # router) dos logs de aplicação, cada um em sua própria stream.
      routing/logs:
        default_pipelines: [logs/app]
        error_mode: ignore
        table:
          - statement: >-
              route() where resource.attributes["k8s.namespace.name"] == "kube-system"
              or resource.attributes["k8s.namespace.name"] == "cert-manager"
              or resource.attributes["k8s.namespace.name"] == "traefik"
              or resource.attributes["k8s.namespace.name"] == "flux-system"
              or resource.attributes["k8s.namespace.name"] == "router"
            pipelines: [logs/infra]

    exporters:
      otlphttp/openobserve_app_logs:
        endpoint: http://openobserve.observability.svc.cluster.local:5080/api/default
        auth:
          authenticator: basicauth/openobserve
        headers:
          stream-name: app_logs
        sending_queue:
          enabled: true
          queue_size: 1024
        retry_on_failure:
          enabled: true
      otlphttp/openobserve_infra_logs:
        endpoint: http://openobserve.observability.svc.cluster.local:5080/api/default
        auth:
          authenticator: basicauth/openobserve
        headers:
          stream-name: infra_logs
        sending_queue:
          enabled: true
          queue_size: 1024
        retry_on_failure:
          enabled: true
      otlphttp/openobserve_metrics:
        endpoint: http://openobserve.observability.svc.cluster.local:5080/api/default
        auth:
          authenticator: basicauth/openobserve
        headers:
          stream-name: infrastructure_metrics
        sending_queue:
          enabled: true
          queue_size: 1024
        retry_on_failure:
          enabled: true
      otlphttp/openobserve_traces:
        endpoint: http://openobserve.observability.svc.cluster.local:5080/api/default
        auth:
          authenticator: basicauth/openobserve
        headers:
          stream-name: application_traces
        sending_queue:
          enabled: true
          queue_size: 1024
        retry_on_failure:
          enabled: true

    service:
      extensions:
        - health_check
        - basicauth/openobserve
      telemetry:
        metrics:
          level: basic
      pipelines:
        logs/in:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, filter/drop_noise, transform/parse_json]
          exporters: [routing/logs]
        logs/app:
          receivers: [routing/logs]
          processors: [batch]
          exporters: [otlphttp/openobserve_app_logs]
        logs/infra:
          receivers: [routing/logs]
          processors: [batch]
          exporters: [otlphttp/openobserve_infra_logs]
        metrics:
          receivers: [otlp, kubeletstats, hostmetrics]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/openobserve_metrics]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/openobserve_traces]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.153.0
          args:
            - --config=/conf/config.yaml
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OPENOBSERVE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: openobserve-credentials
                  key: username
            - name: OPENOBSERVE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openobserve-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /
              port: health
          livenessProbe:
            httpGet:
              path: /
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector
        - name: pod-logs
          hostPath:
            path: /var/log/pods
        - name: hostfs
          hostPath:
            path: /
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
