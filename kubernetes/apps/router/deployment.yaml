apiVersion: v1
kind: Namespace
metadata:
  name: router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: router
  labels:
    app: router
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
      annotations:
        # O nginx nao recarrega sozinho quando o ConfigMap muda. Alterar as rotas
        # exige bater este valor para forcar rollout, ou `kubectl rollout restart`.
        checksum/config: "v1"
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.4-alpine
          # Ignora o entrypoint da imagem, que faz templating e escreve em disco.
          command: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          # Sem limite de CPU de proposito: e caminho de request, precisa poder
          # usar folga do no em pico sem sofrer throttle do CFS. O que importa e
          # ter request garantido para nao cair no peso minimo de cgroup, que foi
          # o problema que o Traefik teve nesta infra.
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: router-config
        - name: tmp
          emptyDir: {}
        - name: tls
          secret:
            secretName: wildcard-tls
---
# ClusterIP: e por aqui que o cloudflared entrega hoje.
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: router
spec:
  type: ClusterIP
  selector:
    app: router
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# REEXPOSTO PARA MEDICAO. O ServiceLB do k3s liga a 443 do host nesta Service,
# entao o Traefik precisa deixar de expor `websecure` -- ver infra/traefik.yaml.
# Isso derruba registry e observe pela Tailscale enquanto estiver valendo.
#
# Historico das medicoes anteriores, normalizado por 1000 rps na mesma rota:
#
#   tunel -> router          21,1% do no
#   direto, sem Cloudflare   15,3% do no   <- ~27% mais barato por request
#
# O que esta rodada quer responder: a VM de teste sem k3s serve o mesmo plinth a
# 7,9% de um core por 1000 rps sobre rede real. O caminho via tunel neste cluster
# custa ~63%. Se o direto ficar proximo de 8%, o custo era fila do cloudflared;
# se ficar em ~31% como na medicao anterior, o problema esta no proprio setup.
apiVersion: v1
kind: Service
metadata:
  name: router-public
  namespace: router
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: router
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
