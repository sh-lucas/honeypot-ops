apiVersion: v1
kind: Namespace
metadata:
  name: router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: router
  labels:
    app: router
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
      annotations:
        # O nginx nao recarrega sozinho quando o ConfigMap muda. Alterar as rotas
        # exige bater este valor para forcar rollout, ou `kubectl rollout restart`.
        checksum/config: "v1"
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.4-alpine
          # Ignora o entrypoint da imagem, que faz templating e escreve em disco.
          command: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          # Sem limite de CPU de proposito: e caminho de request, precisa poder
          # usar folga do no em pico sem sofrer throttle do CFS. O que importa e
          # ter request garantido para nao cair no peso minimo de cgroup, que foi
          # o problema que o Traefik teve nesta infra.
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: router-config
        - name: tmp
          emptyDir: {}
        - name: tls
          secret:
            secretName: wildcard-tls
---
# ClusterIP: e por aqui que o cloudflared entrega hoje.
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: router
spec:
  type: ClusterIP
  selector:
    app: router
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
# A exposicao direta na 443 foi montada, medida e revertida -- mas o resultado
# FAVORECE expor direto, e o que motivou reverter foi o custo colateral, nao o
# desempenho. Normalizado por 1000 rps na mesma rota:
#
#   tunel -> router          21,1% do no
#   direto, sem Cloudflare   15,3% do no   <- ~27% mais barato por request
#
# O cloudflared custa 16,1% do no de forma continua. Tira-lo e a unica forma de
# recuperar essa fatia; o TLS nao some, passa do edge para o nginx.
#
# O que impede hoje: dar a 443 ao router obriga o Traefik a soltar `websecure`,
# o que derruba registry e openobserve pela Tailscale e trava o pull de imagem.
#
# O listener TLS na 8443 e o Certificate curinga seguem dormentes. O passo a
# passo completo para reexpor esta no README, secao "Opcao arquivada".
