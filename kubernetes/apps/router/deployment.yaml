apiVersion: v1
kind: Namespace
metadata:
  name: router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: router
  labels:
    app: router
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge 0 e obrigatorio junto com hostPort: duas replicas nao podem
      # disputar a 443 do host, o pod novo ficaria Pending e travaria o rollout.
      # Custa um instante de indisponibilidade a cada deploy do router.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
      annotations:
        # O nginx nao recarrega sozinho quando o ConfigMap muda. Alterar as rotas
        # exige bater este valor para forcar rollout, ou `kubectl rollout restart`.
        checksum/config: "v1"
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.4-alpine
          # Ignora o entrypoint da imagem, que faz templating e escreve em disco.
          command: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              # Elimina o hop do klipper-lb (svclb): o portmap do CNI faz o DNAT
              # 443 -> 8443 direto no netns do host, uma travessia de pod a menos
              # por request. Medido em loopback: 19,4 us/req e 29% de vazao.
              # O container continua bindando 8443 como nao-root; quem abre a 443
              # e o portmap, no host.
              hostPort: 443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          # Sem limite de CPU de proposito: e caminho de request, precisa poder
          # usar folga do no em pico sem sofrer throttle do CFS. O que importa e
          # ter request garantido para nao cair no peso minimo de cgroup, que foi
          # o problema que o Traefik teve nesta infra.
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: router-config
        - name: tmp
          emptyDir: {}
        - name: tls
          secret:
            secretName: wildcard-tls
---
# ClusterIP: e por aqui que o cloudflared entrega hoje.
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: router
spec:
  type: ClusterIP
  selector:
    app: router
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# A Service `router-public` do tipo LoadBalancer foi REMOVIDA. Ela existia so
# para o ServiceLB do k3s ligar a 443 do host no router, e cada request pagava
# uma travessia extra de netns no pod do klipper-lb. Hoje quem publica a 443 e o
# `hostPort` la em cima, sem pod intermediario.
#
# Efeito colateral esperado: o DaemonSet `svclb-router-public` em kube-system
# some sozinho quando esta Service deixa de existir.
#
# Se precisar voltar atras, e recriar esta Service como LoadBalancer e tirar o
# hostPort do container -- os dois nao podem coexistir disputando a 443.
