# Roteador estatico por header Host. Faz o mesmo trabalho que o Traefik faz no
# entrypoint `web`, sem watch da API do Kubernetes.
#
# Motivo, medido nesta VPS no mesmo caminho de 2 hops (wrk -c50 -> proxy -> plinth):
#   Traefik  7696 rps  254us/req  149us de kernel/req
#   nginx   24515 rps   79us/req   61us de kernel/req
# A infraestrutura de rede e identica nos dois; a diferenca e o custo de syscall
# e escalonamento do runtime Go. Contagem de segmentos TCP por request e 1.0 nos
# dois, entao nao e volume de pacote.
#
# Caminho atual: roteador de entrada. 443 do host -> REDIRECT -> :8443.
# cloudflared em `replicas: 0`, fora do caminho de dados (rollback).
#
# Publicar aplicacao nova aqui = um bloco `upstream` + um bloco `server`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: router-config
  namespace: router
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
      worker_connections 8192;
    }

    http {
      access_log off;

      # A imagem roda com rootfs somente leitura, entao tudo que o nginx precisa
      # escrever vai para o emptyDir montado em /tmp.
      client_body_temp_path /tmp/client_body;
      proxy_temp_path       /tmp/proxy;
      fastcgi_temp_path     /tmp/fastcgi;
      uwsgi_temp_path       /tmp/uwsgi;
      scgi_temp_path        /tmp/scgi;

      sendfile on;
      tcp_nopush on;
      server_tokens off;

      # Upgrade de WebSocket. Em request normal $connection_upgrade fica vazio,
      # que e exatamente o necessario para o keepalive com o upstream funcionar.
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
      }

      # ATENCAO: nginx open source resolve os nomes de upstream UMA VEZ, no start.
      # Se o kube-dns estiver fora nesse instante, o nginx recusa a subir e o pod
      # entra em CrashLoopBackOff ate o DNS voltar (ele se recupera sozinho).
      # Recriar um Service tambem exige `kubectl rollout restart` aqui.
      #
      # A alternativa -- `resolver` + nome em variavel no proxy_pass -- resolve em
      # tempo de request e sobrevive a DNS fora, mas descarta o bloco `upstream` e
      # com ele o keepalive para o backend, que e justamente o que sustenta os
      # 24515 rps medidos. Por isso a escolha aqui e keepalive.
      upstream plinth      { server plinth.plinth.svc.cluster.local:80;        keepalive 128; }
      upstream checkup     { server checkup.checkup.svc.cluster.local:80;      keepalive 64;  }
      upstream hello_world { server hello-world.default.svc.cluster.local:80;  keepalive 64;  }

      # Servicos internos. So existem no listener 8443, alcancado pela 443 do
      # host via REDIRECT. A internet chega ate esse listener, mas o `deny all`
      # por IP de origem la embaixo e quem corta. Nao entram na 8080, que hoje
      # escuta apenas em 127.0.0.1.
      upstream registry_up { server registry.registry.svc.cluster.local:5000;        keepalive 32; }
      upstream observe_up  { server openobserve.observability.svc.cluster.local:5080; keepalive 32; }

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 60s;

      # Sessao TLS reaproveitada entre requests: sem isto cada conexao nova paga
      # um handshake completo, que e o custo que volta ao expor direto em vez de
      # deixar o edge da Cloudflare terminar.
      ssl_certificate     /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      ssl_protocols       TLSv1.2 TLSv1.3;
      ssl_session_cache   shared:SSL:20m;
      ssl_session_timeout 1h;
      ssl_session_tickets on;

      # Hostname desconhecido cai aqui, nas duas portas.
      server {
        listen 127.0.0.1:8080 default_server reuseport;
        listen 8443 ssl default_server reuseport;
        http2 on;
        server_name _;
        location = /healthz { return 200 "ok\n"; }
        location /          { return 404; }
      }

      server {
        listen 127.0.0.1:8080;
        listen 8443 ssl;
        http2 on;
        server_name plinth.sh-lucas.dev;
        location / { proxy_pass http://plinth; }
      }

      server {
        listen 127.0.0.1:8080;
        listen 8443 ssl;
        http2 on;
        server_name checkup.sh-lucas.dev;
        location / { proxy_pass http://checkup; }
      }

      server {
        listen 127.0.0.1:8080;
        listen 8443 ssl;
        http2 on;
        server_name hello-world.sh-lucas.dev;
        location / { proxy_pass http://hello_world; }
      }

      # --- Servicos internos: fechados para a internet publica ---
      #
      # O nginx roda no netns do host (hostNetwork), entao NAO ha mais SNAT de
      # klipper-lb no meio e o IP de origem chega real nos dois caminhos:
      #
      #   internet  -> 443 -> REDIRECT 8443 -> client: IP publico real
      #   Tailscale -> 443 -> REDIRECT 8443 -> client: 100.64.0.0/10 (peer real)
      #   pods      -> 8443                 -> client: 10.42.0.0/16
      #
      # O REDIRECT do netfilter nao reescreve origem, so destino. A observacao
      # antiga de que "filtrar por 100.64.0.0/10 nao funciona" era efeito do
      # svclb, que nao existe mais -- hoje essa faixa e o caminho normal do
      # tailnet e foi verificada respondendo 401/308.
      #
      # A regra se apoia no lado confiavel: a internet chega com IP publico real,
      # e nenhuma faixa privada casa com ela.
      #
      # LIMITE: qualquer pod do cluster casa 10.42.0.0/16 e alcanca estes hosts.
      # Nao e regressao -- registry.registry.svc e openobserve.observability.svc
      # ja sao alcancaveis de dentro do cluster pelo ClusterIP. O que esta regra
      # garante e que a internet publica nao chega.
      #
      # Sem `listen 8080` de proposito, e a 8080 hoje so escuta em 127.0.0.1.

      server {
        listen 8443 ssl;
        http2 on;
        server_name registry.sh-lucas.dev;

        allow 10.42.0.0/16;   # pods -- e por aqui que chega o trafego da Tailscale
        allow 10.0.0.0/24;    # subnet da VCN
        allow 100.64.0.0/10;  # CGNAT do Tailscale, se algum dia chegar sem SNAT
        deny  all;

        # Push de imagem sobe blobs grandes: sem isto o nginx corta em 1MB e
        # bufferiza em disco o que passar. O zot lida com o streaming.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        location / { proxy_pass http://registry_up; }
      }

      server {
        listen 8443 ssl;
        http2 on;
        server_name observe.sh-lucas.dev;

        allow 10.42.0.0/16;   # pods -- e por aqui que chega o trafego da Tailscale
        allow 10.0.0.0/24;    # subnet da VCN
        allow 100.64.0.0/10;  # CGNAT do Tailscale, se algum dia chegar sem SNAT
        deny  all;

        location / { proxy_pass http://observe_up; }
      }
    }
