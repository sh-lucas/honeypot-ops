# ATENCAO: ESTAS DUAS POLICIES ESTAO INERTES.
#
# O router passou a rodar com `hostNetwork: true` (ver deployment.yaml), e
# NetworkPolicy nao se aplica a pod no netns do host -- o kube-router avalia
# policy no veth do pod, que este pod nao tem mais. Nada aqui e enforcado.
#
# Onde o isolamento mora hoje, em nixos/configuration.nix:
#
#   ingresso  cadeias mangle public-block (enp0s6) e tailscale-block (tailscale0).
#             Allowlist de porta que sempre valeu no host, nunca dependeu de
#             netpol: da internet so entra a 443; do tailnet, 22/53/443/6443.
#             As 8443 e 8080 nao sao alcancaveis de fora, e a 8080 ainda escuta
#             so em 127.0.0.1.
#   egresso   cadeia router-egress, casada por `--uid-owner 101`, com a mesma
#             lista de destinos das regras abaixo (DNS, :80 das apps, :5000 do
#             registry, :5080 do observe) e DROP no resto.
#
# Os objetos foram mantidos, e nao apagados, porque voltam a valer sozinhos no
# instante em que alguem tirar o hostNetwork -- que e o caminho de rollback.
# Se mexer nos destinos aqui, mexa tambem na cadeia router-egress, senao as duas
# metades divergem em silencio.
#
# Formato original: entrada restrita, saida em allowlist com as faixas privadas
# negadas em bloco.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloudflared
  namespace: router
spec:
  podSelector:
    matchLabels:
      app: router
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 8080
    # Porta publica. Sem `from`, aceita qualquer origem -- e o ponto: o trafego
    # chega direto da internet pela 443 do host, sem tunel e sem a Cloudflare no
    # meio. So a 8443 e aberta assim; a 8080 continua restrita ao cloudflared.
    - ports:
        - protocol: TCP
          port: 8443
---
# Saida so para DNS e para as tres aplicacoes publicas. Sem regra de internet:
# um roteador nao tem motivo para sair da rede.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: router-egress
  namespace: router
spec:
  podSelector:
    matchLabels:
      app: router
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: plinth
          podSelector:
            matchLabels:
              app: plinth
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: checkup
          podSelector:
            matchLabels:
              app: checkup
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: hello-world
      ports:
        - protocol: TCP
          port: 80
    # Servicos internos, servidos so no listener 8443 e so para origem Tailscale
    # (ver o allow/deny no configmap). Portas diferentes das apps publicas, entao
    # precisam de regra propria.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: registry
          podSelector:
            matchLabels:
              app: registry
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: openobserve
      ports:
        - protocol: TCP
          port: 5080
