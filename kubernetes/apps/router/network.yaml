# Mesmo formato das demais policies do repo: entrada restrita, saida em
# allowlist com as faixas privadas negadas em bloco.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloudflared
  namespace: router
spec:
  podSelector:
    matchLabels:
      app: router
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 8080
    # Porta publica. Sem `from`, aceita qualquer origem -- e o ponto: o trafego
    # chega direto da internet pela 443 do host, sem tunel e sem a Cloudflare no
    # meio. So a 8443 e aberta assim; a 8080 continua restrita ao cloudflared.
    - ports:
        - protocol: TCP
          port: 8443
---
# Saida so para DNS e para as tres aplicacoes publicas. Sem regra de internet:
# um roteador nao tem motivo para sair da rede.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: router-egress
  namespace: router
spec:
  podSelector:
    matchLabels:
      app: router
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: plinth
          podSelector:
            matchLabels:
              app: plinth
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: checkup
          podSelector:
            matchLabels:
              app: checkup
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: hello-world
      ports:
        - protocol: TCP
          port: 80
    # Servicos internos, servidos so no listener 8443 e so para origem Tailscale
    # (ver o allow/deny no configmap). Portas diferentes das apps publicas, entao
    # precisam de regra propria.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: registry
          podSelector:
            matchLabels:
              app: registry
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: openobserve
      ports:
        - protocol: TCP
          port: 5080
