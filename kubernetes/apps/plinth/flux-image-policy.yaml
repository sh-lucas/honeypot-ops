apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: plinth
  namespace: flux-system
spec:
  image: registry.sh-lucas.dev/plinth
  interval: 2m
  secretRef:
    name: registry-credentials
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: plinth
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: plinth
  policy:
    semver:
      range: ">=0.0.0"
  filterTags:
    pattern: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
