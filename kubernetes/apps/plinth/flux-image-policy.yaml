apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: plinth
  namespace: flux-system
spec:
  # :8443 é o listener do router nginx que aceita pods (allow 10.42.0.0/16);
  # a 443 do tailnet só funciona vinda do host/kubelet, não de pod.
  image: registry.sh-lucas.dev:8443/plinth
  interval: 2m
  secretRef:
    name: registry-credentials
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: plinth
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: plinth
  policy:
    alphabetical:
      order: asc
  filterTags:
    # Filtra tags no formato "YYYY.MM.DD--run--sha"; run é o github.run_id,
    # que pode crescer além de 4 dígitos e é monotônico entre renames.
    pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}--[0-9]+--[a-f0-9]+$'
